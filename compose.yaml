services:
  jalsethu:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      JALSETHU_ENV: production
      JALSETHU_DB_PATH: /data/jalsetu.db
      JALSETU_OTP_SECRET: ${JALSETU_OTP_SECRET:?Set a unique JALSETU_OTP_SECRET in .env}
      JALSETHU_ADMIN_TOKEN: ${JALSETHU_ADMIN_TOKEN:?Set a unique JALSETHU_ADMIN_TOKEN in .env}
      JALSETHU_CORS_ORIGINS: ${JALSETHU_CORS_ORIGINS:-http://localhost:8000}
      JALSETHU_UPI_ID_P: ${JALSETHU_UPI_ID_P:-}
      JALSETHU_UPI_ID_A: ${JALSETHU_UPI_ID_A:-}
      JALSETHU_UPI_ID_B: ${JALSETHU_UPI_ID_B:-}
      JALSETHU_UPI_ID_C: ${JALSETHU_UPI_ID_C:-}
      JALSETHU_UPI_ID_D: ${JALSETHU_UPI_ID_D:-}
      JALSETHU_UPI_ID_E: ${JALSETHU_UPI_ID_E:-}
      JALSETHU_UPI_ID_F: ${JALSETHU_UPI_ID_F:-}
      JALSETHU_UPI_ID_G: ${JALSETHU_UPI_ID_G:-}
    volumes:
      - jalsethu-data:/data

volumes:
  jalsethu-data:

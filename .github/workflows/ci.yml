name: JalSetu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-container-smoke:
    runs-on: ubuntu-latest
    env:
      JALSETU_OTP_SECRET: ci-only-otp-secret-with-enough-random-looking-bytes-001
      JALSETHU_ADMIN_TOKEN: ci-only-admin-token-different-and-long-enough-002
      JALSETHU_CORS_ORIGINS: https://ci.example.invalid
      JALSETHU_PORT: "18000"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run backend regression suite
        run: python -m unittest discover -s tests -v
        working-directory: backend

      - name: Run driver dashboard workflow test
        run: node --test frontend/tests/*.test.mjs

      - name: Validate Compose and smoke-test production container
        shell: bash
        run: |
          set -eu
          compose_ok=0
          cleanup() {
            if [ "$compose_ok" -ne 1 ]; then
              docker compose logs --no-color || true
            fi
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose config --quiet
          docker compose up --build --detach

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container did not become ready within 60 seconds" >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18000/citizen.html >/dev/null
          compose_ok=1

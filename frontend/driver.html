<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JalSetu-Lite | Driver</title>
<script src="./auth.js"></script>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px
    }

    .header {
      text-align: center;
      margin-bottom: 20px
    }

    .header h1 {
      margin: 0;
      color: #0f766e
    }

    .header p {
      margin-top: 6px;
      color: #64748b
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
      margin-bottom: 16px
    }

    h2 {
      margin-top: 0
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b
    }

    .warning {
      display: block;
      background: #fef3c7;
      color: #92400e
    }

    .delivery-section {
      display: none
    }

    .small {
      font-size: 13px;
      color: #64748b;
      margin-top: -8px;
      margin-bottom: 15px
    }

    /* =========================================================
   THEME SYSTEM
   ========================================================= */

    :root {
      color-scheme: light;

      --bg-color: #f4f7fb;
      --text-color: #1f2937;
      --muted-color: #64748b;

      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;

      --primary-color: #0f766e;
      --secondary-color: #475569;

      --switcher-bg: rgba(255, 255, 255, 0.95);
      --switcher-border: #d1d5db;
      --switcher-text: #475569;
      --switcher-active-bg: #0f766e;
      --switcher-active-text: #ffffff;

      --shadow-color: rgba(0, 0, 0, 0.08);

      --success-bg: #dcfce7;
      --success-text: #166534;

      --error-bg: #fee2e2;
      --error-text: #991b1b;

      --warning-bg: #fef3c7;
      --warning-text: #92400e;

      --info-bg: #dbeafe;
      --info-text: #1e40af;
    }

    /* System dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --bg-color: #0f172a;
        --text-color: #e5e7eb;
        --muted-color: #94a3b8;

        --card-bg: #1e293b;
        --input-bg: #0f172a;
        --input-border: #475569;

        --primary-color: #14b8a6;
        --secondary-color: #64748b;

        --switcher-bg: rgba(30, 41, 59, 0.96);
        --switcher-border: #475569;
        --switcher-text: #cbd5e1;
        --switcher-active-bg: #14b8a6;
        --switcher-active-text: #042f2e;

        --shadow-color: rgba(0, 0, 0, 0.35);

        --success-bg: #14532d;
        --success-text: #bbf7d0;

        --error-bg: #7f1d1d;
        --error-text: #fecaca;

        --warning-bg: #78350f;
        --warning-text: #fde68a;

        --info-bg: #1e3a8a;
        --info-text: #bfdbfe;
      }
    }

    /* Force light */
    html[data-theme="light"] {
      color-scheme: light;

      --bg-color: #f4f7fb;
      --text-color: #1f2937;
      --muted-color: #64748b;

      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;

      --primary-color: #0f766e;
      --secondary-color: #475569;

      --switcher-bg: rgba(255, 255, 255, 0.95);
      --switcher-border: #d1d5db;
      --switcher-text: #475569;
      --switcher-active-bg: #0f766e;
      --switcher-active-text: #ffffff;

      --shadow-color: rgba(0, 0, 0, 0.08);

      --success-bg: #dcfce7;
      --success-text: #166534;

      --error-bg: #fee2e2;
      --error-text: #991b1b;

      --warning-bg: #fef3c7;
      --warning-text: #92400e;

      --info-bg: #dbeafe;
      --info-text: #1e40af;
    }

    /* Force dark */
    html[data-theme="dark"] {
      color-scheme: dark;

      --bg-color: #0f172a;
      --text-color: #e5e7eb;
      --muted-color: #94a3b8;

      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --input-border: #475569;

      --primary-color: #14b8a6;
      --secondary-color: #64748b;

      --switcher-bg: rgba(30, 41, 59, 0.96);
      --switcher-border: #475569;
      --switcher-text: #cbd5e1;
      --switcher-active-bg: #14b8a6;
      --switcher-active-text: #042f2e;

      --shadow-color: rgba(0, 0, 0, 0.35);

      --success-bg: #14532d;
      --success-text: #bbf7d0;

      --error-bg: #7f1d1d;
      --error-text: #fecaca;

      --warning-bg: #78350f;
      --warning-text: #fde68a;

      --info-bg: #1e3a8a;
      --info-text: #bfdbfe;
    }

    /* Apply theme variables */
    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    /* Keep the existing centered header from being covered */
    .header {
      padding-top: 48px;
    }

    .header p,
    .hint,
    .small {
      color: var(--muted-color);
    }

    .header h1 {
      color: var(--primary-color);
    }

    .card {
      background: var(--card-bg);
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    input,
    select,
    textarea {
      background: var(--input-bg);
      color: var(--text-color);
      border-color: var(--input-border);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted-color);
    }

    button {
      background: var(--primary-color);
    }

    .secondary {
      background: var(--secondary-color);
    }

    /* Status messages */
    .success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .error {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .warning {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .info {
      background: var(--info-bg);
      color: var(--info-text);
    }

    /* =========================================================
   SEGMENTED THEME SWITCHER
   ========================================================= */

    .theme-switcher {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;

      display: inline-flex;
      align-items: center;

      padding: 4px;

      background: var(--switcher-bg);
      border: 1px solid var(--switcher-border);
      border-radius: 999px;

      box-shadow: 0 4px 14px var(--shadow-color);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .theme-option {
      width: auto;
      min-width: 58px;

      padding: 7px 11px;

      border: none;
      border-radius: 999px;

      background: transparent;
      color: var(--switcher-text);

      font-family: inherit;
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .theme-option:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .theme-option.active {
      background: var(--switcher-active-bg);
      color: var(--switcher-active-text);
    }

    .theme-option:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    /* Small screens */
    @media (max-width: 480px) {
      .theme-switcher {
        top: 8px;
        left: 8px;
      }

      .theme-option {
        min-width: 52px;
        padding: 7px 8px;
        font-size: 11px;
      }

      .header {
        padding-top: 44px;
      }
    }
  </style>
</head>

<body data-role="driver">
  <div class="theme-switcher" role="group" aria-label="Theme selection">
    <button type="button" class="theme-option" data-theme-choice="system">
      System
    </button>

    <button type="button" class="theme-option" data-theme-choice="light">
      Light
    </button>

    <button type="button" class="theme-option" data-theme-choice="dark">
      Dark
    </button>
  </div>
  <div class="container">
    <div class="header">
      <h1>JalSetu-Lite</h1>
      <p>Driver Delivery Panel</p>
    </div>
    <div class="card">
      <label for="order_id">Order ID</label>
      <input type="text" id="order_id" placeholder="Enter Order ID">
      <button id="arrivalBtn" onclick="markArrival()">MARK ARRIVAL</button>
      <button id="statusBtn" onclick="checkOrderStatus(true)" style="margin-top:10px;background:#475569;">CHECK ORDER
        STATUS</button>
      <div id="arrivalStatus" class="status"></div>
    </div>

    <div id="deliverySection" class="card delivery-section">
      <h2>Complete Delivery</h2>
      <label for="otp">Customer OTP</label>
      <input type="text" id="otp" placeholder="Enter 4-digit OTP" maxlength="4" inputmode="numeric"
        autocomplete="one-time-code">
      <p class="small">Enter the 4-digit OTP provided by the customer.</p>
      <label for="meter_before">Initial Meter Reading</label>
      <input type="number" id="meter_before" placeholder="Enter initial reading" min="0" step="1">
      <label for="meter_after">Final Meter Reading</label>
      <input type="number" id="meter_after" placeholder="Enter final reading" min="0" step="1">
      <button id="deliverBtn" onclick="completeDelivery()">DELIVER WATER</button>
      <div id="deliveryStatus" class="status"></div>
    </div>
  </div>
  <script>
    const API_BASE = window.JALSETHU_API_BASE || "http://127.0.0.1:8000";
    let currentOrderId = null;

    function showStatus(id, msg, type) { const el = document.getElementById(id); el.textContent = msg; el.className = "status " + type }
    async function readResponse(response) { const text = await response.text(); if (!text) return {}; try { return JSON.parse(text) } catch { return { message: text } } }

    window.addEventListener("DOMContentLoaded", async () => {
      const saved = localStorage.getItem("jalsetu_order_id");
      if (saved) {
        document.getElementById("order_id").value = saved;
        await checkOrderStatus(false);
      }
    });

    async function checkOrderStatus(showErrors = true) {
      const orderId = document.getElementById("order_id").value.trim();
      if (!orderId) {
        if (showErrors) showStatus("arrivalStatus", "❌ Please enter an Order ID.", "error");
        return null;
      }

      try {
        const response = await fetch(`${API_BASE}/status/${encodeURIComponent(orderId)}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });
        const data = await readResponse(response);

        if (!response.ok) {
          if (showErrors) showStatus("arrivalStatus", `❌ ${data.message || data.error || "Order not found."}`, "error");
          return null;
        }

        currentOrderId = orderId;
        localStorage.setItem("jalsetu_order_id", orderId);

        const status = String(data.status || "").toUpperCase();

        if (status === "ARRIVED") {
          showStatus("arrivalStatus", "✅ Driver already arrived. Complete the delivery below.", "success");
          document.getElementById("deliverySection").style.display = "block";
          document.getElementById("arrivalBtn").style.display = "none";
          document.getElementById("statusBtn").style.display = "none";
        } else if (status === "DELIVERED") {
          showStatus("arrivalStatus", "✅ This order has already been delivered.", "success");
          document.getElementById("deliverySection").style.display = "none";
          document.getElementById("arrivalBtn").style.display = "none";
          document.getElementById("statusBtn").style.display = "none";
        } else if (status === "DISPATCHED") {
          document.getElementById("arrivalBtn").style.display = "block";
          if (showErrors) showStatus("arrivalStatus", "📦 Order is dispatched. You can mark arrival.", "success");
        } else {
          document.getElementById("arrivalBtn").style.display = "block";
          if (showErrors) showStatus("arrivalStatus", `ℹ️ Current order status: ${status || "UNKNOWN"}.`, "warning");
        }

        return data;
      } catch (e) {
        console.error(e);
        if (showErrors) showStatus("arrivalStatus", "❌ Cannot connect to the JalSetu-Lite server.", "error");
        return null;
      }
    }

    async function markArrival() {
      const orderId = document.getElementById("order_id").value.trim();
      if (!orderId) { showStatus("arrivalStatus", "❌ Please enter an Order ID.", "error"); return }

      const button = document.getElementById("arrivalBtn");
      button.disabled = true;
      button.textContent = "CHECKING...";

      try {
        // Check first so we never try ARRIVED -> ARRIVED or DELIVERED -> ARRIVED.
        const current = await checkOrderStatus(true);
        if (!current) {
          return;
        }

        const status = String(current.status || "").toUpperCase();

        if (status === "ARRIVED" || status === "DELIVERED") {
          return;
        }

        if (status !== "DISPATCHED") {
          showStatus("arrivalStatus", `⚠️ Cannot mark arrival while order status is ${status || "UNKNOWN"}.`, "warning");
          return;
        }

        button.textContent = "MARKING ARRIVAL...";

        const response = await fetch(`${API_BASE}/driver/arrive/${encodeURIComponent(orderId)}`, {
          method: "POST",
          headers: { "Accept": "application/json" }
        });
        const data = await readResponse(response);

        if (response.ok) {
          currentOrderId = orderId;
          localStorage.setItem("jalsetu_order_id", orderId);
          showStatus("arrivalStatus", "✅ Driver arrival confirmed.", "success");
          document.getElementById("deliverySection").style.display = "block";
          button.style.display = "none";
        } else {
          // If another driver/action already changed the state, refresh it instead of
          // leaving the UI in a misleading state.
          if (response.status === 409) {
            await checkOrderStatus(true);
          } else {
            showStatus("arrivalStatus", `❌ ${data.message || data.error || "Unable to mark arrival."}`, "error");
          }
        }
      } catch (e) {
        console.error(e);
        showStatus("arrivalStatus", "❌ Cannot connect to the JalSetu-Lite server.", "error");
      } finally {
        if (button.style.display !== "none") {
          button.disabled = false;
          button.textContent = "MARK ARRIVAL";
        }
      }
    }

    async function completeDelivery() {
      if (!currentOrderId) { showStatus("deliveryStatus", "❌ Mark arrival first.", "error"); return }
      const otp = document.getElementById("otp").value.trim();
      const meterBefore = Number.parseInt(document.getElementById("meter_before").value, 10);
      const meterAfter = Number.parseInt(document.getElementById("meter_after").value, 10);
      if (!/^\d{4}$/.test(otp)) { showStatus("deliveryStatus", "❌ OTP must contain exactly 4 digits.", "error"); return }
      if (!Number.isInteger(meterBefore) || !Number.isInteger(meterAfter) || meterBefore < 0 || meterAfter < 0) {
        showStatus("deliveryStatus", "❌ Meter readings must be valid non-negative integers.", "error"); return
      }
      if (meterAfter < meterBefore) { showStatus("deliveryStatus", "❌ Final meter reading cannot be less than the initial reading.", "error"); return }
      const button = document.getElementById("deliverBtn"); button.disabled = true; button.textContent = "PROCESSING...";
      const payload = { otp, meter_before: meterBefore, meter_after: meterAfter };
      try {
        const response = await fetch(`${API_BASE}/driver/deliver/${encodeURIComponent(currentOrderId)}`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
        });
        const data = await readResponse(response);
        if (response.ok) {
          const litres = data.litres_delivered;
          showStatus("deliveryStatus", `✅ Delivery completed successfully!${litres != null ? " " + litres + " L delivered." : ""}`, "success");
          button.textContent = "DELIVERY COMPLETED";
          button.disabled = true;
          return;
        }
        if (response.status === 422 && (data.error === "WRONG_OTP" || data.code === "WRONG_OTP")) {
          showStatus("deliveryStatus", `❌ Incorrect OTP.${data.attempts_left != null ? " " + data.attempts_left + " attempt(s) remaining." : ""}`, "error");
        } else if (response.status === 409 && (data.error === "OTP_LOCKED" || data.code === "OTP_LOCKED")) {
          showStatus("deliveryStatus", "🔒 OTP verification is locked.", "warning"); button.disabled = true; button.textContent = "OTP LOCKED"; return
        } else if (response.status === 409 && (data.error === "VOLUME_MISMATCH" || data.code === "VOLUME_MISMATCH")) {
          showStatus("deliveryStatus", `⚠️ Volume mismatch.${data.litres_delivered != null ? " Recorded " + data.litres_delivered + " L." : ""}`, "warning");
        } else {
          showStatus("deliveryStatus", `❌ ${data.message || data.error || "Delivery could not be completed."}`, "error");
        }
      } catch (e) { console.error(e); showStatus("deliveryStatus", "❌ Cannot connect to the JalSetu-Lite server.", "error") }
      finally {
        if (!button.disabled) { button.disabled = false; button.textContent = "DELIVER WATER" }
      }
    }
    /* =========================================================
     THEME SWITCHER
     ========================================================= */

    const THEME_STORAGE_KEY = "jalsetu-theme";

    function getSavedTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);

      if (
        saved === "system" ||
        saved === "light" ||
        saved === "dark"
      ) {
        return saved;
      }

      return "system";
    }

    function applyTheme(theme) {
      const root = document.documentElement;

      if (theme === "system") {
        root.removeAttribute("data-theme");
      } else {
        root.setAttribute("data-theme", theme);
      }

      document.querySelectorAll(".theme-option").forEach(button => {
        const isActive =
          button.dataset.themeChoice === theme;

        button.classList.toggle("active", isActive);
        button.setAttribute(
          "aria-pressed",
          isActive ? "true" : "false"
        );
      });
    }

    function setTheme(theme) {
      localStorage.setItem(THEME_STORAGE_KEY, theme);
      applyTheme(theme);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = getSavedTheme();

      applyTheme(savedTheme);

      document.querySelectorAll(".theme-option").forEach(button => {
        button.addEventListener("click", () => {
          const selectedTheme =
            button.dataset.themeChoice;

          setTheme(selectedTheme);
        });
      });
    });
  </script>
</body>

</html>

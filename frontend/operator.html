<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JalSetu-Lite | Operator</title>
  <script src="./auth.js"></script>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 20px
    }

    .header {
      text-align: center;
      margin-bottom: 20px
    }

    .header h1 {
      margin: 0;
      color: #0f766e
    }

    .header p {
      margin-top: 6px;
      color: #64748b
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
      margin-bottom: 16px
    }

    h2 {
      margin-top: 0
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer
    }

    button:hover {
      opacity: .92
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed
    }

    .secondary {
      background: #475569
    }

    .dispatch {
      background: #2563eb
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af
    }

    .warning {
      display: block;
      background: #fef3c7;
      color: #92400e
    }

    .hidden {
      display: none
    }

    .hint,
    .small {
      font-size: 13px;
      color: #64748b
    }

    .hint {
      margin-top: -7px;
      margin-bottom: 15px
    }

    .offer {
      border: 1px solid #dbe4ee;
      border-radius: 12px;
      padding: 15px;
      margin: 12px 0;
      background: #f8fafc
    }

    .offer.selected {
      border: 2px solid #0f766e;
      background: #ecfeff
    }

    .offer-title {
      font-size: 18px;
      font-weight: 800
    }

    .offer-meta {
      font-size: 14px;
      color: #475569;
      margin: 6px 0 12px
    }

    .assigned-order { display: grid; gap: 8px; }
    .assigned-order-title { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .assigned-order-meta { color: #475569; font-size: 14px; white-space: pre-line; }
    .assigned-order-status { min-height: 20px; font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .order-info {
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      margin-top: 12px
    }

    /* ── Dispatch confirmation banner ── */
    .dispatch-banner {
      display: none;
      margin-top: 18px;
      padding: 20px;
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      border: 2px solid #34d399;
      border-radius: 14px;
      text-align: center;
    }
    .dispatch-banner.visible { display: block; }
    .dispatch-banner h3 {
      margin: 0 0 6px;
      color: #065f46;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .dispatch-banner .order-id-big {
      font-size: 2.4rem;
      font-weight: 900;
      color: #047857;
      letter-spacing: .08em;
      margin: 8px 0;
    }
    .dispatch-banner .share-note {
      font-size: 13px;
      color: #065f46;
      margin: 4px 0 14px;
    }
    .dispatch-banner .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .dispatch-banner .copy-btn,
    .dispatch-banner .link-btn {
      width: auto;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 0;
      font-weight: 700;
    }
    .dispatch-banner .copy-btn { background: #047857; color: #fff; }
    .dispatch-banner .copy-btn:hover { background: #065f46; }
    .dispatch-banner .link-btn { background: #fff; color: #047857; border: 1.5px solid #34d399; }
    .dispatch-banner .link-btn:hover { background: #ecfdf5; }
    html[data-theme="dark"] .dispatch-banner,
    @media (prefers-color-scheme: dark) { .dispatch-banner {
      background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
      border-color: #059669;
    }}
    html[data-theme="dark"] .dispatch-banner h3 { color: #a7f3d0; }
    html[data-theme="dark"] .dispatch-banner .order-id-big { color: #6ee7b7; }
    html[data-theme="dark"] .dispatch-banner .share-note { color: #a7f3d0; }
    html[data-theme="dark"] .dispatch-banner .copy-btn { background: #059669; }
    html[data-theme="dark"] .dispatch-banner .link-btn { background: #064e3b; color: #6ee7b7; border-color: #059669; }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 7px 0
    }

    .label {
      font-weight: bold
    }

    @media(max-width:520px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    /* =========================================================
   THEME SYSTEM
   ========================================================= */

    :root {
      color-scheme: light;

      --bg-color: #f4f7fb;
      --text-color: #1f2937;
      --muted-color: #64748b;

      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;

      --primary-color: #0f766e;
      --secondary-color: #475569;

      --switcher-bg: rgba(255, 255, 255, 0.95);
      --switcher-border: #d1d5db;
      --switcher-text: #475569;
      --switcher-active-bg: #0f766e;
      --switcher-active-text: #ffffff;

      --shadow-color: rgba(0, 0, 0, 0.08);

      --success-bg: #dcfce7;
      --success-text: #166534;

      --error-bg: #fee2e2;
      --error-text: #991b1b;

      --warning-bg: #fef3c7;
      --warning-text: #92400e;

      --info-bg: #dbeafe;
      --info-text: #1e40af;
    }

    /* System dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --bg-color: #0f172a;
        --text-color: #e5e7eb;
        --muted-color: #94a3b8;

        --card-bg: #1e293b;
        --input-bg: #0f172a;
        --input-border: #475569;

        --primary-color: #14b8a6;
        --secondary-color: #64748b;

        --switcher-bg: rgba(30, 41, 59, 0.96);
        --switcher-border: #475569;
        --switcher-text: #cbd5e1;
        --switcher-active-bg: #14b8a6;
        --switcher-active-text: #042f2e;

        --shadow-color: rgba(0, 0, 0, 0.35);

        --success-bg: #14532d;
        --success-text: #bbf7d0;

        --error-bg: #7f1d1d;
        --error-text: #fecaca;

        --warning-bg: #78350f;
        --warning-text: #fde68a;

        --info-bg: #1e3a8a;
        --info-text: #bfdbfe;
      }
    }

    /* Force light */
    html[data-theme="light"] {
      color-scheme: light;

      --bg-color: #f4f7fb;
      --text-color: #1f2937;
      --muted-color: #64748b;

      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;

      --primary-color: #0f766e;
      --secondary-color: #475569;

      --switcher-bg: rgba(255, 255, 255, 0.95);
      --switcher-border: #d1d5db;
      --switcher-text: #475569;
      --switcher-active-bg: #0f766e;
      --switcher-active-text: #ffffff;

      --shadow-color: rgba(0, 0, 0, 0.08);

      --success-bg: #dcfce7;
      --success-text: #166534;

      --error-bg: #fee2e2;
      --error-text: #991b1b;

      --warning-bg: #fef3c7;
      --warning-text: #92400e;

      --info-bg: #dbeafe;
      --info-text: #1e40af;
    }

    /* Force dark */
    html[data-theme="dark"] {
      color-scheme: dark;

      --bg-color: #0f172a;
      --text-color: #e5e7eb;
      --muted-color: #94a3b8;

      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --input-border: #475569;

      --primary-color: #14b8a6;
      --secondary-color: #64748b;

      --switcher-bg: rgba(30, 41, 59, 0.96);
      --switcher-border: #475569;
      --switcher-text: #cbd5e1;
      --switcher-active-bg: #14b8a6;
      --switcher-active-text: #042f2e;

      --shadow-color: rgba(0, 0, 0, 0.35);

      --success-bg: #14532d;
      --success-text: #bbf7d0;

      --error-bg: #7f1d1d;
      --error-text: #fecaca;

      --warning-bg: #78350f;
      --warning-text: #fde68a;

      --info-bg: #1e3a8a;
      --info-text: #bfdbfe;
    }

    /* Apply theme variables */
    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    /* Keep the existing centered header from being covered */
    .header {
      padding-top: 48px;
    }

    .header p,
    .hint,
    .small {
      color: var(--muted-color);
    }

    .header h1 {
      color: var(--primary-color);
    }

    .card {
      background: var(--card-bg);
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    input,
    select,
    textarea {
      background: var(--input-bg);
      color: var(--text-color);
      border-color: var(--input-border);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted-color);
    }

    button {
      background: var(--primary-color);
    }

    .secondary {
      background: var(--secondary-color);
    }

    /* Status messages */
    .success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .error {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .warning {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .info {
      background: var(--info-bg);
      color: var(--info-text);
    }

    /* =========================================================
   SEGMENTED THEME SWITCHER
   ========================================================= */

    .theme-switcher {
      top: 12px;
      left: 12px;
      z-index: 9999;

      display: inline-flex;
      align-items: center;

      padding: 4px;

      background: var(--switcher-bg);
      border: 1px solid var(--switcher-border);
      border-radius: 999px;

      box-shadow: 0 4px 14px var(--shadow-color);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .theme-option {
      width: auto;
      min-width: 58px;

      padding: 7px 11px;

      border: none;
      border-radius: 999px;

      background: transparent;
      color: var(--switcher-text);

      font-family: inherit;
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .theme-option:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .theme-option.active {
      background: var(--switcher-active-bg);
      color: var(--switcher-active-text);
    }

    .theme-option:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    /* Small screens */
    @media (max-width: 480px) {
      .theme-switcher {
        top: 8px;
        left: 8px;
      }

      .theme-option {
        min-width: 52px;
        padding: 7px 8px;
        font-size: 11px;
      }

      .header {
        padding-top: 44px;
      }
    }
  </style>
</head>

<body data-role="operator"><br>
  <div class="theme-switcher" role="group" aria-label="Theme selection">
    <button type="button" class="theme-option" data-theme-choice="system">
      System
    </button>

    <button type="button" class="theme-option" data-theme-choice="light">
      Light
    </button>

    <button type="button" class="theme-option" data-theme-choice="dark">
      Dark
    </button>
  </div>
  <div class="container">
    <div class="header">
      <h1>JalSetu-Lite</h1>
      <p>Operator Order Dashboard</p>
    </div>

    <div class="card">
      <h2>Find Water Service</h2>
      <div class="grid">
        <div><label for="capacity">Capacity (L)</label>
          <select id="capacity" name="capacity">
            <option value="" disabled selected>Select Capacity</option>
            <option value="4000">4,000 L</option>
            <option value="5000">5,000 L</option>
            <option value="6000">6,000 L</option>
            <option value="12000">12,000 L</option>
          </select>
        </div>
        <div><label for="waterType">Water Type</label>
          <select id="waterType">
            <option value="fresh">Fresh</option>
            <option value="treated">Treated</option>
          </select>
        </div>
        <div><label for="lat">Latitude</label><input id="lat" type="number" step="any" value="12.9141"></div>
        <div><label for="lng">Longitude</label><input id="lng" type="number" step="any" value="74.8560"></div>
      </div>
      <button id="searchBtn" onclick="searchOffers()">SEARCH AVAILABLE SERVICES</button>
      <div id="searchStatus" class="status"></div>
      <div id="offers"></div>
    </div>

    <div class="card" id="operatorOrdersCard">
      <h2>Your customer orders</h2>
      <p class="small">Orders for your service appear here automatically. New and updated orders refresh every 10 seconds.</p>
      <button class="secondary" type="button" onclick="loadOperatorOrders()">REFRESH ORDERS</button>
      <div id="operatorOrdersStatus" class="status" role="status" aria-live="polite"></div>
      <div id="operatorOrders" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.JALSETHU_API_BASE || "http://127.0.0.1:8000";
    let selectedOffer = null;
    let currentOffers = [];
    let loadingOperatorOrders = false;

    function showStatus(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg; el.className = "status " + type;
    }
    async function readResponse(response) {
      const text = await response.text();
      if (!text) return {};
      try { return JSON.parse(text) } catch { return { message: text } }
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function searchOffers() {
      const capacity = Number.parseInt(document.getElementById("capacity").value, 10);
      const water_type = document.getElementById("waterType").value;
      const lat = Number(document.getElementById("lat").value);
      const lng = Number(document.getElementById("lng").value);
      if (!Number.isInteger(capacity)) {
        showStatus(
          "searchStatus",
          "❌ Please select a water capacity.",
          "error"
        );
        return;
      }

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        showStatus(
          "searchStatus",
          "❌ Enter valid latitude and longitude.",
          "error"
        );
        return;
      }
      const btn = document.getElementById("searchBtn"); btn.disabled = true; btn.textContent = "SEARCHING...";
      document.getElementById("offers").innerHTML = "";
      try {
        const response = await fetch(`${API_BASE}/search`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ capacity_l: capacity, water_type, lat, lng })
        });
        const data = await readResponse(response);
        if (!response.ok) { showStatus("searchStatus", `❌ ${data.message || data.error || "Search failed."}`, "error"); return }
        const offers = Array.isArray(data.offers) ? data.offers : [];
        currentOffers = offers;
        if (!offers.length) { showStatus("searchStatus", "⚠️ No available services were returned.", "warning"); return }
        showStatus("searchStatus", `✅ Found ${offers.length} available service(s). Select one below.`, "success");
        document.getElementById("offers").innerHTML = offers.map((offer, i) => `
   <div class="offer" id="offer-${i}">
    <div class="offer-title">${escapeHtml(offer.name || "Unnamed Operator")}</div>
    <div class="offer-meta">
     Operator ID: ${escapeHtml(offer.operator_id)} · ${escapeHtml(offer.type || "")}<br>
     ₹${escapeHtml(offer.price)} · ₹${escapeHtml(offer.price_per_1000l)} / 1000L · ETA ${escapeHtml(offer.eta_min)} min<br>
     ${escapeHtml(offer.distance_km)} km · ⭐ ${escapeHtml(offer.rating)}
     ${offer.flagged ? " · ⚠️ Flagged" : ""}
    </div>
    <button onclick="selectOffer(${i})">SELECT THIS SERVICE</button>
   </div>`).join("");
      } catch (e) { console.error(e); showStatus("searchStatus", "❌ Cannot connect to the JalSetu-Lite server.", "error") }
      finally { btn.disabled = false; btn.textContent = "SEARCH AVAILABLE SERVICES" }
    }

    async function selectOffer(index) {
      const offer = currentOffers[index];
      if (!offer) { showStatus("searchStatus", "❌ Selected service data is unavailable. Please search again.", "error"); return }
      selectedOffer = offer;
      document.querySelectorAll(".offer").forEach(x => x.classList.remove("selected"));
      const selected = document.getElementById(`offer-${index}`); if (selected) selected.classList.add("selected");
      showStatus("searchStatus", `✅ ${offer.name} selected. Customer orders for your service appear in Your customer orders below.`, "success");
    }

    async function loadOperatorOrders() {
      if (loadingOperatorOrders) return;
      loadingOperatorOrders = true;
      try {
        const response = await fetch(`${API_BASE}/operator/orders`);
        const data = await readResponse(response);
        if (!response.ok) throw new Error(data.message || data.error || "Could not load your customer orders.");
        const orders = Array.isArray(data.orders) ? data.orders : [];
        const list = document.getElementById("operatorOrders");
        list.replaceChildren();
        if (!orders.length) {
          const empty = document.createElement("p");
          empty.className = "small";
          empty.textContent = "No active orders for your service yet.";
          list.appendChild(empty);
        }
        orders.forEach(function (order) {
          const card = document.createElement("article");
          card.className = "offer assigned-order";
          const heading = document.createElement("div");
          heading.className = "assigned-order-title";
          const orderId = document.createElement("strong");
          orderId.textContent = order.order_id;
          const status = document.createElement("strong");
          status.textContent = order.status;
          heading.append(orderId, status);
          const details = document.createElement("div");
          details.className = "assigned-order-meta";
          const location = Number.isFinite(Number(order.lat)) && Number.isFinite(Number(order.lng))
            ? `\nDelivery: ${Number(order.lat).toFixed(5)}, ${Number(order.lng).toFixed(5)}`
            : "";
          details.textContent = `${order.capacity_l} L · ${order.water_type} · ₹${order.price}${location}\nReceived: ${new Date(order.created_at).toLocaleString()}`;
          card.append(heading, details);
          if (order.status === "CONFIRMED") {
            const dispatch = document.createElement("button");
            dispatch.className = "dispatch";
            dispatch.type = "button";
            dispatch.textContent = "DISPATCH TO DRIVER";
            dispatch.addEventListener("click", function () { dispatchAssignedOrder(order.order_id, dispatch, card); });
            card.appendChild(dispatch);
          } else {
            const note = document.createElement("div");
            note.className = "small";
            note.textContent = order.status === "OFFERED"
              ? "Waiting for the customer to confirm this order."
              : order.status === "DISPATCHED"
                ? "Dispatched; waiting for the driver to arrive."
                : "The driver has arrived at the delivery location.";
            card.appendChild(note);
          }
          list.appendChild(card);
        });
        showStatus("operatorOrdersStatus", `Updated just now · ${orders.length} active order(s).`, "info");
      } catch (error) {
        showStatus("operatorOrdersStatus", `❌ ${error.message || "Could not load your customer orders."}`, "error");
      } finally {
        loadingOperatorOrders = false;
      }
    }

    async function dispatchAssignedOrder(orderId, button, card) {
      button.disabled = true;
      button.textContent = "DISPATCHING…";
      try {
        const response = await fetch(`${API_BASE}/operator/dispatch/${encodeURIComponent(orderId)}`, { method: "POST" });
        const data = await readResponse(response);
        if (!response.ok) throw new Error(data.message || data.error || "Unable to dispatch this order.");
        const status = document.createElement("div");
        status.className = "assigned-order-status success";
        status.textContent = `✅ ${data.order_id || orderId} dispatched to the driver.`;
        card.appendChild(status);
        await loadOperatorOrders();
      } catch (error) {
        const status = document.createElement("div");
        status.className = "assigned-order-status error";
        status.textContent = error.message || "Could not dispatch this order.";
        card.appendChild(status);
        button.disabled = false;
        button.textContent = "DISPATCH TO DRIVER";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      loadOperatorOrders();
      setInterval(loadOperatorOrders, 10000);
    });
    /* =========================================================
     THEME SWITCHER
     ========================================================= */

    const THEME_STORAGE_KEY = "jalsetu-theme";

    function getSavedTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);

      if (
        saved === "system" ||
        saved === "light" ||
        saved === "dark"
      ) {
        return saved;
      }

      return "system";
    }

    function applyTheme(theme) {
      const root = document.documentElement;

      if (theme === "system") {
        root.removeAttribute("data-theme");
      } else {
        root.setAttribute("data-theme", theme);
      }

      document.querySelectorAll(".theme-option").forEach(button => {
        const isActive =
          button.dataset.themeChoice === theme;

        button.classList.toggle("active", isActive);
        button.setAttribute(
          "aria-pressed",
          isActive ? "true" : "false"
        );
      });
    }

    function setTheme(theme) {
      localStorage.setItem(THEME_STORAGE_KEY, theme);
      applyTheme(theme);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = getSavedTheme();

      applyTheme(savedTheme);

      document.querySelectorAll(".theme-option").forEach(button => {
        button.addEventListener("click", () => {
          const selectedTheme =
            button.dataset.themeChoice;

          setTheme(selectedTheme);
        });
      });
    });
  </script>
</body>

</html>
